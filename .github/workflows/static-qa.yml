name: WealthLight Site QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/site.js
          node --check scripts/contact.js
          node --check server.mjs
      - name: Render transparent financial PNG illustrations
        run: node scripts/render-financial-art.mjs
      - name: Verify local pages and image references
        run: node scripts/check-site.mjs
      - name: Test real HTTP responses and the contact endpoint
        run: node scripts/smoke-test.mjs
